name: Telegram Downloader Bot

# GitHub Actions job max ~6 hours. Persist temp/ across restarts so downloads resume.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"
  push:
    branches: [main]

concurrency:
  group: telegram-downloader-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write   # push bot-data branch
      actions: write    # save/restore cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Restore temp cache (large partial downloads)
        uses: actions/cache/restore@v4
        with:
          path: |
            temp
          key: bot-temp-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bot-temp-

      - name: Restore temp from bot-data branch
        run: |
          chmod +x scripts/restore_workdir.sh
          ./scripts/restore_workdir.sh

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Configure environment
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "Missing secret BOT_TOKEN"
            exit 1
          fi
          {
            echo "BOT_TOKEN=$BOT_TOKEN"
            echo "MAX_FILE_SIZE_MB=2000"
            echo "MAX_CONCURRENT_DOWNLOADS=10"
            echo "DOWNLOAD_DIR=temp"
            echo "TELEGRAM_API_BASE_URL="
            echo "TELEGRAM_API_ID=${TELEGRAM_API_ID:-}"
            echo "TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}"
          } > .env
          mkdir -p temp downloads

      - name: Start local Telegram Bot API (2 GB uploads)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "${TELEGRAM_API_ID}" ] || [ -z "${TELEGRAM_API_HASH}" ]; then
            echo "Skipping local Bot API — 50 MB upload limit"
            exit 0
          fi
          docker pull aiogram/telegram-bot-api:latest
          docker rm -f telegram-bot-api 2>/dev/null || true
          mkdir -p bot_api_data
          docker run -d --name telegram-bot-api \
            -p 8081:8081 \
            -v "$PWD/bot_api_data:/var/lib/telegram-bot-api" \
            aiogram/telegram-bot-api:latest \
            --api-id="$TELEGRAM_API_ID" \
            --api-hash="$TELEGRAM_API_HASH" \
            --local \
            --http-port=8081 \
            --dir=/var/lib/telegram-bot-api
          ok=0
          for i in $(seq 1 45); do
            if curl -sf "http://127.0.0.1:8081/bot${BOT_TOKEN}/getMe" >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "Local Bot API not ready — using official API (50 MB)"
            docker logs telegram-bot-api || true
            exit 0
          fi
          sed -i 's|^TELEGRAM_API_BASE_URL=.*|TELEGRAM_API_BASE_URL=http://127.0.0.1:8081|' .env
          echo "Local Bot API enabled for up to 2 GB uploads"

      - name: Ensure Actions can write to repo
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # Fail early with a clear message if token cannot push (repo set to read-only workflows)
          if ! gh api "repos/${{ github.repository }}" --jq .permissions.push | grep -q true; then
            echo "::warning::Token may lack push access. Set repo Settings→Actions→General→Workflow permissions to 'Read and write', or add secret REPO_PAT (classic PAT with repo scope)."
          fi

      - name: Run bot (periodic persist in background)
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/persist_workdir.sh
          (
            while true; do
              sleep 900
              ./scripts/persist_workdir.sh || true
            done
          ) &
          echo $! > /tmp/persist.pid
          echo "Starting bot (resumable temp/ + cache + bot-data branch)"
          set +e
          python bot.py
          code=$?
          set -e
          kill "$(cat /tmp/persist.pid)" 2>/dev/null || true
          exit "$code"

      - name: Persist temp to bot-data branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/persist_workdir.sh
          ./scripts/persist_workdir.sh || true

      - name: Save temp cache (includes large partials up to ~2GB)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            temp
          key: bot-temp-${{ github.run_id }}-${{ github.run_attempt }}
