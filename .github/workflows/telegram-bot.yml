name: Telegram Downloader Bot

# GitHub Actions is not a real VPS: each job max ~6 hours.
# This workflow keeps the bot alive by restarting on a schedule.
on:
  workflow_dispatch:
  schedule:
    # Restart before the 6h job limit (overlap cancelled via concurrency)
    - cron: "0 */5 * * *"
  push:
    branches: [main]

concurrency:
  group: telegram-downloader-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Configure environment
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "Missing secret BOT_TOKEN"
            exit 1
          fi
          {
            echo "BOT_TOKEN=$BOT_TOKEN"
            echo "MAX_FILE_SIZE_MB=2000"
            echo "MAX_CONCURRENT_DOWNLOADS=10"
            echo "DOWNLOAD_DIR=temp"
            echo "TELEGRAM_API_BASE_URL="
            echo "TELEGRAM_API_ID=${TELEGRAM_API_ID:-}"
            echo "TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}"
          } > .env
          mkdir -p temp downloads

      - name: Start local Telegram Bot API (2 GB uploads)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "${TELEGRAM_API_ID}" ] || [ -z "${TELEGRAM_API_HASH}" ]; then
            echo "Skipping local Bot API (TELEGRAM_API_ID / HASH secrets not set) — 50 MB upload limit"
            exit 0
          fi
          docker pull aiogram/telegram-bot-api:latest
          docker rm -f telegram-bot-api 2>/dev/null || true
          mkdir -p bot_api_data
          docker run -d --name telegram-bot-api \
            -p 8081:8081 \
            -v "$PWD/bot_api_data:/var/lib/telegram-bot-api" \
            aiogram/telegram-bot-api:latest \
            --api-id="$TELEGRAM_API_ID" \
            --api-hash="$TELEGRAM_API_HASH" \
            --local \
            --http-port=8081 \
            --dir=/var/lib/telegram-bot-api
          ok=0
          for i in $(seq 1 45); do
            if curl -sf "http://127.0.0.1:8081/bot${BOT_TOKEN}/getMe" >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "Local Bot API did not become ready; continuing with official API (50 MB upload limit)"
            docker logs telegram-bot-api || true
            exit 0
          fi
          sed -i 's|^TELEGRAM_API_BASE_URL=.*|TELEGRAM_API_BASE_URL=http://127.0.0.1:8081|' .env
          echo "Local Bot API enabled for up to 2 GB uploads"

      - name: Run bot
        run: |
          echo "Starting bot (job will run until cancelled/timeout ~5h50m, then schedule restarts it)"
          python bot.py
